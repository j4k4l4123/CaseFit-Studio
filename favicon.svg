<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Subtle border -->
  <rect x="4" y="4" width="504" height="504" rx="104" fill="none" stroke="rgba(16,185,129,0.2)" stroke-width="4"/>
  <!-- Phone silhouette (simplified) -->
  <rect x="168" y="72" width="176" height="340" rx="24" fill="none" stroke="url(#green)" stroke-width="16" filter="url(#glow)"/>
  <!-- Camera module dots -->
  <circle cx="232" cy="120" r="14" fill="url(#green)" opacity="0.8"/>
  <circle cx="280" cy="120" r="14" fill="url(#green)" opacity="0.8"/>
  <!-- Case outline (slightly bigger than phone) -->
  <rect x="152" y="56" width="208" height="372" rx="32" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="18 10" opacity="0.5"/>
  <!-- "CF" text -->
  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="72" fill="url(#green)" letter-spacing="6">CF</text>
</svg>
